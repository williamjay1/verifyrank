[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verifyrank"
version = "0.2.0"
description = "Evaluation of frozen ranking policies with incomplete shared reference evidence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "junjiezhang"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
verifyrank = "verifyrank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
