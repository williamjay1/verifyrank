name: Python package checks

# Prepared configuration; no remote execution is claimed during release preparation.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools and build wheel
        run: |
          python -m pip install --disable-pip-version-check 'setuptools>=68' wheel
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - name: Test source and synthetic CLI
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v
      - name: Install wheel in a clean environment
        run: |
          python -m venv --without-pip .ci-venv
          python -m pip --python .ci-venv/bin/python install --no-index --no-deps dist/verifyrank-0.2.0-py3-none-any.whl
      - name: Test installed wheel and CSV/JSON CLI
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: .ci-venv/bin/python -I scripts/validate_release.py
